name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [master]

# 默认 GITHUB_TOKEN 为只读，创建 Release 需要显式授予写入权限
permissions:
  contents: write

jobs:
  build-macos:
    name: Build SmartPDF Pro (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ofd-core 以路径依赖（../ofd-utility/ofd-core）引入，CI 需要把
      # ofd-utility 克隆到 SmartPDF-Pro 的兄弟目录，cargo 的路径依赖才能解析。
      # 固定到本地验证所用的一致提交，保证渲染 API 一致。
      - name: Checkout ofd-utility (path dependency)
        run: git clone --depth 1 https://github.com/ofd-utility/ofd-utility.git "${{ runner.workspace }}/ofd-utility"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 一次构建产出 x86_64 / arm64 两个 .app
      - name: Build app bundles (all archs)
        run: ./build_app.sh release all

      # 分别打包三个 zip，保留 .app 包结构
      - name: Zip x86_64
        run: ditto -c -k --sequesterRsrc --keepParent "dist/x86_64/SmartPDF Pro.app" "SmartPDF-Pro-macOS-x86_64.zip"
      - name: Zip arm64
        run: ditto -c -k --sequesterRsrc --keepParent "dist/arm64/SmartPDF Pro.app" "SmartPDF-Pro-macOS-arm64.zip"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDF-Pro-macOS
          path: |
            SmartPDF-Pro-macOS-x86_64.zip
            SmartPDF-Pro-macOS-arm64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            SmartPDF-Pro-macOS-x86_64.zip
            SmartPDF-Pro-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
