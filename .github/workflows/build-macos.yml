name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [master]

# 默认 GITHUB_TOKEN 为只读，创建 Release 需要显式授予写入权限
permissions:
  contents: write

jobs:
  build-macos:
    name: Build SmartPDF Pro (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build app bundle
        run: ./build_app.sh release

      - name: Zip .app (保留 .app 包结构)
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SmartPDF Pro.app" "SmartPDF-Pro-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDF-Pro-macOS
          path: SmartPDF-Pro-macOS.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartPDF-Pro-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
