name: Build macOS

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  build-macos:
    name: Build SmartPDF Pro (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build app bundle
        run: ./build_app.sh release

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDF-Pro-macOS
          path: dist/SmartPDF Pro.app
          if-no-files-found: error
